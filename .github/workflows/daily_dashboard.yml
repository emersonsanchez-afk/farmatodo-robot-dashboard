name: Daily Robot Dashboard Update

on:
  schedule:
    # Ejecutar cada día a las 6:00 AM Colombia (UTC-5 = 11:00 AM UTC)
    - cron: '0 11 * * *'
  workflow_dispatch:
    inputs:
      days:
        description: 'Número de días a procesar (default: 1 = ayer)'
        required: false
        default: '1'

jobs:
  update-dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Actualizar dashboard
        env:
          GAUSIUM_USERNAME:   ${{ secrets.GAUSIUM_USERNAME }}
          GAUSIUM_PASSWORD:   ${{ secrets.GAUSIUM_PASSWORD }}
          ROBOT_SERIAL:       ${{ secrets.ROBOT_SERIAL }}
          DASHBOARD_TEMPLATE: dashboard_robot_v11.html
          OUTPUT_PATH:        index.html
          GOOGLE_DRIVE_ID:    ${{ secrets.GOOGLE_DRIVE_ID }}
          NOTIFY_EMAIL:       ${{ secrets.NOTIFY_EMAIL }}
        run: |
          DAYS="${{ github.event.inputs.days || '1' }}"
          python run_daily.py --days $DAYS

      - name: Subir dashboard actualizado como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-${{ github.run_number }}
          path: index.html
          retention-days: 30

      - name: Commit historial actualizado
        run: |
          git config user.name  "Robot Dashboard Bot"
          git config user.email "bot@farmatodo.com"
          git add robot_history.json index.html
          git diff --staged --quiet || git commit -m "📊 Dashboard actualizado $(date '+%Y-%m-%d')"
          git push
